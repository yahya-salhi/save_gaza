services:
  postgres:
    image: postgres:16-alpine
    container_name: savegaza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savegaza
    ports:
      - "5432:5432"
    volumes:
      - savegaza-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d savegaza"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  savegaza-pgdata:
